<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HANA TCG LAB</title><meta name="description" content="Choose a hero. Fight for memories. Play live with a friend.">
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#11141d;--line:#293041;--fg:#f6f2ed;--muted:#9299aa;--flame:#ff5671;--tide:#5aaaff;--bloom:#63d49c;--veil:#b67cff;--gold:#f3ca6e}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -15%,#28233d,#0c0e15 36rem,#08090d 65rem);color:var(--fg);font:14px/1.35 Inter,system-ui,sans-serif}button{font:inherit;color:inherit}.app{width:min(1450px,100%);margin:auto;padding:10px 10px 158px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:9px 0;background:#08090dec}.brand{display:flex;align-items:center;gap:8px;font-weight:950;letter-spacing:.13em}.mark{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--flame),var(--veil),var(--tide),var(--bloom),var(--flame));box-shadow:inset 0 0 0 6px #0e1017}.pill{font-size:9px;padding:3px 6px;border:1px solid #ffffff2b;border-radius:99px;color:var(--muted)}.btn{border:1px solid var(--line);background:#171b27;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--fg);color:#08090d;font-weight:850}.notice{padding:10px;border:1px solid var(--line);border-radius:12px;background:#11141d;color:var(--muted);margin-bottom:9px}.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:14px;background:#0e1119;margin-bottom:9px}.player{display:flex;gap:8px;align-items:center}.player.right{justify-content:flex-end;text-align:right}.avatar{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-weight:950}.name{font-weight:850}.small{font-size:11px;color:var(--muted)}.memory{color:var(--gold);font-weight:900}.status{text-align:center;font-weight:900}.table{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.scene{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#0e1118;min-width:0}.scene-head{padding:11px;min-height:68px;background:linear-gradient(135deg,#ffffff09,transparent);border-bottom:1px solid var(--line)}.scene-name{font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase}.scene-rule{font-size:10px;color:var(--muted);margin-top:4px}.zone{padding:8px;min-height:125px}.zone.foe{border-bottom:1px dashed #ffffff18}.zone-title{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.units{display:flex;gap:6px;flex-wrap:wrap}.unit{width:108px;min-height:99px;border:1px solid #ffffff1e;background:linear-gradient(150deg,#1e2332,#11141d);border-radius:11px;padding:7px;text-align:left;cursor:pointer}.unit.off{opacity:.55}.unit.sel{outline:2px solid #fff}.unit-name{font-weight:850;font-size:11px;min-height:30px}.unit-stats{font-weight:900;margin-top:8px}.pow{color:#ffdb86}.hp{color:#ff8695}.gear{font-size:9px;color:var(--bloom);margin-top:4px}.dock{border:1px solid var(--line);background:#10131c;border-radius:14px;padding:9px;margin:9px 0;min-height:66px}.dock-title{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.row{display:flex;gap:6px;flex-wrap:wrap}.row button{border:1px solid #ffffff22;background:#1a1e2b;border-radius:9px;padding:8px 9px;cursor:pointer}.log{display:flex;gap:12px;overflow:auto;color:var(--muted);font-size:10px;padding:4px 2px}.log span{white-space:nowrap}.select{padding:12px 0}.intro{text-align:center;max-width:620px;margin:20px auto}.intro h1{font-size:clamp(34px,7vw,64px);line-height:.9;letter-spacing:-.055em;margin:0}.intro p{color:var(--muted)}.decks{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.deck{min-height:245px;border:1px solid var(--line);border-radius:17px;background:#11141d;padding:13px;text-align:left;cursor:pointer;position:relative;overflow:hidden}.deck:after{content:"";position:absolute;inset:0;opacity:.24;pointer-events:none}.deck.flame:after{background:radial-gradient(circle at 80% 10%,var(--flame),transparent 43%)}.deck.tide:after{background:radial-gradient(circle at 80% 10%,var(--tide),transparent 43%)}.deck.bloom:after{background:radial-gradient(circle at 80% 10%,var(--bloom),transparent 43%)}.deck.veil:after{background:radial-gradient(circle at 80% 10%,var(--veil),transparent 43%)}.deck>*{position:relative;z-index:1}.deck h3{margin:54px 0 4px;font-size:20px}.deck .style{margin-top:24px;color:var(--muted)}.deck.locked{outline:2px solid white}.hand-wrap{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:30px 10px 10px;background:linear-gradient(transparent,#08090de8 28%,#08090dfb 55%)}.hand{max-width:1450px;margin:auto;display:flex;gap:7px;overflow-x:auto;padding:4px 0}.card{flex:0 0 145px;height:194px;border:1px solid #ffffff25;border-radius:13px;background:#12151f;overflow:hidden;cursor:pointer;position:relative;text-align:left}.card.sel{outline:2px solid white;transform:translateY(-5px)}.art{height:68px;display:grid;place-items:center;font-size:31px;font-weight:950;background:linear-gradient(145deg,#252a3b,#0d1018)}.flame .art{background:linear-gradient(145deg,#6d2432,#151017)}.tide .art{background:linear-gradient(145deg,#1b416a,#101622)}.bloom .art{background:linear-gradient(145deg,#194c38,#101813)}.veil .art{background:linear-gradient(145deg,#4a286d,#17101f)}.card-body{padding:7px}.card-name{font-weight:900;font-size:11px;padding-right:23px;line-height:1.1}.cost{position:absolute;right:6px;top:74px;width:24px;height:24px;border-radius:8px;background:#080a0f;border:1px solid #ffffff2a;display:grid;place-items:center;font-weight:950}.type{font-size:8px;letter-spacing:.11em;color:var(--muted);text-transform:uppercase;margin:5px 0}.text{font-size:9px;color:#d6d9e3}.foot{position:absolute;left:7px;right:7px;bottom:6px;display:flex;justify-content:space-between;font-size:10px;font-weight:900}@media(max-width:850px){.app{padding-left:7px;padding-right:7px}.bar{grid-template-columns:1fr 1fr}.status{grid-column:1/-1;grid-row:1}.table{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.scene{flex:0 0 87vw;scroll-snap-align:center}.decks{grid-template-columns:1fr 1fr}.brand .title{display:none}.unit{width:96px}.card{flex-basis:135px;height:187px}}@media(max-width:480px){.decks{grid-template-columns:1fr}.deck{min-height:170px}.deck h3{margin-top:25px}.scene{flex-basis:92vw}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark"></div><span class="title">HANA TCG</span><span class="pill">LAB v0.1</span></div><div><button class="btn" id="rulesBtn">Rules</button> <button class="btn primary" id="inviteBtn">Invite friend</button></div></header><div id="root">Connecting...</div></main><div id="handMount"></div>
<script>
const API="https://rqloovqablskjjylobdh.supabase.co/functions/v1/hana-tcg";let room=new URLSearchParams(location.search).get("room");if(!room){room=crypto.randomUUID().replaceAll("-","");history.replaceState(null,"",location.pathname+"?room="+room)}
const KEY="hana-tcg-player";let player=localStorage.getItem(KEY);if(!player){player=crypto.randomUUID();localStorage.setItem(KEY,player)}
let last=null,selHand=null,selUnit=null,errorText="",rulesOpen=false,busy=false;
const root=document.querySelector("#root"),handMount=document.querySelector("#handMount");
async function api(body){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...body,room,player})});const j=await r.json();if(!r.ok)throw new Error(j.error||"request failed");return j}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function units(v,owner){const a=[];(v.scenes||[]).forEach((s,si)=>s.units.forEach(u=>{if(u.owner===owner)a.push({u,si})}));return a}
function power(v,u,si){const c=v.cards[u.cardId];let n=c.p||0;(u.items||[]).forEach(it=>n+=v.cards[it.cardId].pb||0);if(si===0&&c.c<=2)n++;if(si===2&&v.form[u.owner])n++;return n}
function total(v,p,si){return v.scenes[si].units.filter(u=>u.owner===p).reduce((a,u)=>a+power(v,u,si),0)}
function deck(v,p){const k=v.selectedDeck[p];return k&&v.deckInfo[k]?v.deckInfo[k]:null}
function icon(c){return c.e==="flame"?"F":c.e==="tide"?"T":c.e==="bloom"?"B":"V"}
function unitHTML(v,u,si,own){const c=v.cards[u.cardId],gear=(u.items||[]).length;return '<button class="unit '+(u.ready?"":"off")+(selUnit===u.uid?" sel":"")+'" data-unit="'+esc(u.uid)+'" '+(own&&v.yourTurn?"":"disabled")+'><div class="unit-name">'+esc(c.n)+'</div><div class="unit-stats"><span class="pow">P '+power(v,u,si)+'</span> / <span class="hp">HP '+u.hp+'/'+u.maxHp+'</span></div>'+(gear?'<div class="gear">Gear x'+gear+'</div>':'')+'</button>'}
function cardHTML(v,x){const c=v.cards[x.cardId],price=v.playCosts[x.uid]??c.c;return '<button class="card '+c.e+(selHand===x.uid?" sel":"")+'" data-card="'+esc(x.uid)+'"><div class="art">'+icon(c)+'</div><div class="cost">'+price+'</div><div class="card-body"><div class="card-name">'+esc(c.n)+'</div><div class="type">'+c.e+' / '+c.t+'</div><div class="text">'+esc(c.x)+'</div></div><div class="foot">'+(c.t==="character"?'<span>P '+c.p+'</span><span>HP '+c.h+'</span>':'<span>'+c.t.toUpperCase()+'</span><span>'+price+' E</span>')+'</div></button>'}
function playerHTML(v,p,right){const d=deck(v,p),me=p===v.you,form=v.form[p];return '<div class="player '+(right?"right":"")+'"><div class="avatar">'+(d?d.element[0].toUpperCase():"?")+'</div><div><div class="name">'+(me?"YOU":d?esc(d.lead):"OPPONENT")+(form?' <span class="pill">FORM</span>':'')+'</div><div class="small"><span class="memory">Memory '+v.memories[p]+'/5</span> | Energy '+v.energy[p]+'/'+v.maxEnergy[p]+' | Hand '+v.handCount[p]+'</div></div></div>'}
function rules(){return '<div class="notice"><b>ONE-PAGE RULES</b><br>Draw 5. Energy starts at 2 and normally grows by 1 each round to 8. Players alternate exactly one action: play, move, challenge, claim, Overdrive, or pass. Moving, challenging and claiming exhaust a character. To claim, your Power at that Scene must exceed your opponent. Claim at most once per round. Two passes end the round: draw 1, ready everyone, refresh Energy. Overdrive is once per game: +2 Energy now, but your maximum does not grow next round. First to 5 Memories wins. Each Lead transforms when its condition is met.</div>'}
function choose(v,msg){const keys=["hana","le","rei","firefly"],styles={hana:"Pressure / tempo / brave overextension",le:"Control / movement / patience",rei:"Durability / items / compounding value",firefly:"Disruption / tricks / positional theft"};const cards=keys.map(k=>{const d=v?.deckInfo?.[k]||{name:k.toUpperCase(),lead:"",element:k==="hana"?"flame":k==="le"?"tide":k==="rei"?"bloom":"veil",trigger:""};const mine=v&&v.you&&v.selectedDeck[v.you]===k;return '<button class="deck '+d.element+(mine?" locked":"")+'" data-deck="'+k+'" '+(!v||mine?"disabled":"")+'><div class="small">'+d.element.toUpperCase()+'</div><h3>'+esc(d.name)+'</h3><div>'+esc(d.lead)+'</div><div class="style">'+styles[k]+'</div><div class="small" style="margin-top:12px">Transform: '+esc(d.trigger)+'</div></button>'}).join("");return '<section class="select"><div class="intro"><h1>CHOOSE YOUR HERO.</h1><p>Four starters. Same rules. Different instincts.</p></div>'+(msg.status==="waiting"?'<div class="notice">Waiting for your friend. Tap <b>Invite friend</b> and send this room link.</div>':'')+(v?.opponentLocked?'<div class="notice">Your opponent has locked a starter. Their choice stays hidden until you lock yours.</div>':'')+'<div class="decks">'+cards+'</div></section>'}
function dock(v){if(!v.yourTurn)return '<div class="dock"><div class="dock-title">Opponent action</div><div class="small">They take one action, then you respond.</div></div>';const own=units(v,v.you),foe=units(v,v.opponent);let bs=[],h=v.hands.find(x=>x.uid===selHand);if(h){const c=v.cards[h.cardId];if(c.t==="character")v.scenes.forEach((s,i)=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-scene="'+i+'">Play to '+esc(s.name)+'</button>'));else if(c.t==="item")own.forEach(z=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'">Attach to '+esc(v.cards[z.u.cardId].n)+'</button>'));else if(c.target==="none")bs.push('<button data-act="play" data-uid="'+h.uid+'">Play '+esc(c.n)+'</button>');else if(c.target==="own")own.forEach(z=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'">'+esc(c.n)+' -> '+esc(v.cards[z.u.cardId].n)+'</button>'));else if(c.target==="enemy")foe.forEach(z=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'">'+esc(c.n)+' -> '+esc(v.cards[z.u.cardId].n)+'</button>'));else{const a=c.target==="ownMove"?own:foe;a.forEach(z=>v.scenes.forEach((s,i)=>{if(i!==z.si)bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'" data-scene="'+i+'">'+esc(v.cards[z.u.cardId].n)+' -> '+esc(s.name)+'</button>')}))}}else if(selUnit){const z=own.find(x=>x.u.uid===selUnit);if(z&&z.u.ready){v.scenes.forEach((s,i)=>{if(i!==z.si)bs.push('<button data-act="move" data-uid="'+z.u.uid+'" data-scene="'+i+'">Move -> '+esc(s.name)+'</button>')});v.scenes[z.si].units.filter(u=>u.owner===v.opponent).forEach(u=>bs.push('<button data-act="challenge" data-attacker="'+z.u.uid+'" data-target="'+u.uid+'">Challenge '+esc(v.cards[u.cardId].n)+'</button>'));bs.push('<button data-act="claim" data-uid="'+z.u.uid+'">Claim this Scene</button>')}}bs.push('<button data-act="pass">Pass</button>');if(!v.overdriveUsed[v.you])bs.push('<button data-act="overdrive">OVERDRIVE +2</button>');return '<div class="dock"><div class="dock-title">'+(h?'Selected: '+esc(v.cards[h.cardId].n):selUnit?'Character actions':'Your action')+'</div><div class="row">'+bs.join("")+'</div></div>'}
function render(msg){last=msg;const v=msg.view;if(!v){root.innerHTML=(rulesOpen?rules():"")+choose(null,msg);handMount.innerHTML="";bind();return}if(v.phase==="choose"){root.innerHTML=(rulesOpen?rules():"")+choose(v,msg)+(errorText?'<div class="notice" style="color:#ff756f">'+esc(errorText)+'</div>':'');handMount.innerHTML="";bind();return}const p1=v.you,p2=v.opponent,status=msg.status==="over"?(msg.result?.winner===v.you?"YOU WON THE FIFTH MEMORY":"YOUR FRIEND WON"):(v.yourTurn?"YOUR ACTION":"OPPONENT ACTION");root.innerHTML=(rulesOpen?rules():"")+'<div class="bar">'+playerHTML(v,p1,false)+'<div class="status">'+status+'<div class="small">Round '+v.round+(errorText?' | <span style="color:#ff756f">'+esc(errorText)+'</span>':'')+'</div></div>'+playerHTML(v,p2,true)+'</div><div class="table">'+v.scenes.map((s,si)=>'<section class="scene"><div class="scene-head"><div class="scene-name">'+esc(s.name)+'</div><div class="scene-rule">'+esc(s.text)+'</div></div><div class="zone foe"><div class="zone-title"><span>Opponent</span><span>P '+total(v,p2,si)+'</span></div><div class="units">'+s.units.filter(u=>u.owner===p2).map(u=>unitHTML(v,u,si,false)).join("")+'</div></div><div class="zone"><div class="zone-title"><span>You</span><span>P '+total(v,p1,si)+'</span></div><div class="units">'+s.units.filter(u=>u.owner===p1).map(u=>unitHTML(v,u,si,true)).join("")+'</div></div></section>').join("")+'</div>'+dock(v)+'<div class="log">'+v.log.map(x=>'<span>'+esc(x)+'</span>').join("")+'</div>'+(msg.status==="over"?'<div class="dock"><button class="btn primary" data-reset>Play again</button></div>':'');handMount.innerHTML='<div class="hand-wrap"><div class="hand">'+v.hands.map(x=>cardHTML(v,x)).join("")+'</div></div>';bind()}
async function act(action){try{busy=true;errorText="";render(await api({op:"action",action}))}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}}
function bind(){document.querySelectorAll("[data-deck]").forEach(b=>b.addEventListener("click",()=>act({type:"selectDeck",deck:b.dataset.deck})));document.querySelectorAll("[data-card]").forEach(b=>b.addEventListener("click",()=>{selUnit=null;selHand=selHand===b.dataset.card?null:b.dataset.card;render(last)}));document.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",()=>{selHand=null;selUnit=selUnit===b.dataset.unit?null:b.dataset.unit;render(last)}));document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{const a={type:b.dataset.act};for(const k of ["uid","target","attacker"])if(b.dataset[k])a[k]=b.dataset[k];if(b.dataset.scene!==undefined)a.scene=Number(b.dataset.scene);selHand=null;selUnit=null;act(a)}));document.querySelectorAll("[data-reset]").forEach(b=>b.addEventListener("click",async()=>{try{render(await api({op:"reset"}))}catch(e){errorText=e.message}}))}
document.querySelector("#rulesBtn").addEventListener("click",()=>{rulesOpen=!rulesOpen;if(last)render(last)});
document.querySelector("#inviteBtn").addEventListener("click",async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:"HANA TCG LAB",text:"Play a HANA match with me.",url:u});else if(navigator.clipboard){await navigator.clipboard.writeText(u);alert("Invite link copied.")}else prompt("Send this link to your friend:",u)}catch{}});
async function boot(){try{render(await api({op:"join"}))}catch(e){root.innerHTML='<div class="notice">Could not join: '+esc(e.message)+'</div>'}}
setInterval(async()=>{if(busy)return;try{const s=await api({op:"state"});if(JSON.stringify(s)!==JSON.stringify(last))render(s)}catch{}},800);boot();
</script></body></html>
