:1}.table{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.scene{flex:0 0 87vw;scroll-snap-align:center}.decks{grid-template-columns:1fr 1fr}.brand .title{display:none}.unit{width:96px}.card{flex-basis:135px;height:187px}}@media(max-width:480px){.decks{grid-template-columns:1fr}.deck{min-height:170px}.deck h3{margin-top:25px}.scene{flex-basis:92vw}}

</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark"></div><span class="title">HANA TCG</span><span class="pill">PLAYTEST v0.3</span></div><div><button class="btn" id="rulesBtn">Rules</button> <button class="btn primary" id="inviteBtn">Play a friend</button></div></header><div id="root">Connecting...</div></main><div id="handMount"></div>
<script>
const API="https://rqloovqablskjjylobdh.supabase.co/functions/v1/hana-tcg";let room=new URLSearchParams(location.search).get("room");if(!room){room=crypto.randomUUID().replaceAll("-","");history.replaceState(null,"",location.pathname+"?room="+room)}
const KEY="hana-tcg-player";let player=localStorage.getItem(KEY);if(!player){player=crypto.randomUUID();localStorage.setItem(KEY,player)}
let last=null,selHand=null,selUnit=null,errorText="",rulesOpen=false,busy=false,feedbackSent=false,activeScene=0;
const root=document.querySelector("#root"),handMount=document.querySelector("#handMount");
async function api(body){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...body,room,player})});const j=await r.json();if(!r.ok)throw new Error(j.error||"request failed");return j}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function units(v,owner){const a=[];(v.scenes||[]).forEach((s,si)=>s.units.forEach(u=>{if(u.owner===owner)a.push({u,si})}));return a}
function power(v,u,si){const c=v.cards[u.cardId];let n=c.p||0;(u.items||[]).forEach(it=>n+=v.cards[it.cardId].pb||0);if(si===0&&c.c<=2)n++;if(si===2&&v.form[u.owner])n++;return n}
function total(v,p,si){return v.scenes[si].units.filter(u=>u.owner===p).reduce((a,u)=>a+power(v,u,si),0)}
function canClaim(v,si){return v.yourTurn&&!v.claimed[v.you]&&total(v,v.you,si)>total(v,v.opponent,si)&&v.scenes[si].units.some(u=>u.owner===v.you&&u.ready)}
function sceneNav(v){return '<div class="scene-nav">'+v.scenes.map((s,i)=>'<button data-scene-nav="'+i+'" class="'+(i===activeScene?'active':'')+'">'+esc(s.name)+(canClaim(v,i)?' · CLAIM':'')+'</button>').join("")+'</div>'}
function deck(v,p){const k=v.selectedDeck[p];return k&&v.deckInfo[k]?v.deckInfo[k]:null}
function icon(c){return c.e==="flame"?"F":c.e==="tide"?"T":c.e==="bloom"?"B":"V"}
function unitHTML(v,u,si,own){const c=v.cards[u.cardId],gear=(u.items||[]).length;return '<button class="unit '+(u.ready?"":"off")+(selUnit===u.uid?" sel":"")+'" data-unit="'+esc(u.uid)+'" '+(own&&v.yourTurn?"":"disabled")+'><div class="unit-name">'+esc(c.n)+'</div><div class="unit-stats"><span class="pow">P '+power(v,u,si)+'</span> / <span class="hp">HP '+u.hp+'/'+u.maxHp+'</span></div>'+(gear?'<div class="gear">Gear x'+gear+'</div>':'')+'</button>'}
function cardHTML(v,x){const c=v.cards[x.cardId],price=v.playCosts[x.uid]??c.c,afford=price<=v.energy[v.you];return '<button class="card '+c.e+' '+(afford?'affordable':'unaffordable')+(selHand===x.uid?" sel":"")+'" data-card="'+esc(x.uid)+'"><div class="art">'+icon(c)+(afford?'<span class="card-hint">PLAY</span>':'')+'</div><div class="cost">'+price+'</div><div class="card-body"><div class="card-name">'+esc(c.n)+'</div><div class="type">'+c.e+' / '+c.t+'</div><div class="text">'+esc(c.x)+'</div></div><div class="foot">'+(c.t==="character"?'<span>P '+c.p+'</span><span>HP '+c.h+'</span>':'<span>'+c.t.toUpperCase()+'</span><span>'+price+' E</span>')+'</div></button>'}
function playerHTML(v,p,right){const d=deck(v,p),me=p===v.you,form=v.form[p],label=me?"YOU":p==="BOT"?(d?"COMPUTER · "+d.lead:"COMPUTER"):(d?d.lead:"OPPONENT");return '<div class="player '+(right?"right":"")+'"><div class="avatar">'+(d?d.element[0].toUpperCase():"?")+'</div><div><div class="name">'+esc(label)+(form?' <span class="pill">FORM</span>':'')+'</div><div class="small"><span class="memory">Memory '+v.memories[p]+'/5</span> | Energy '+v.energy[p]+'/'+v.maxEnergy[p]+' | Hand '+v.handCount[p]+'</div></div></div>'}
function rules(){return '<div class="notice"><b>ONE-PAGE RULES</b><br>Draw 5. Energy starts at 2 and normally grows by 1 each round to 8. Players alternate exactly one action: play, move, challenge, claim, Overdrive, or pass. Moving, challenging and claiming exhaust a character. To claim, your Power at that Scene must exceed your opponent. Claim at most once per round. Two passes end the round: draw 1, ready everyone, refresh Energy. Overdrive is once per game: +2 Energy now, but your maximum does not grow next round. First to 5 Memories wins. Each Lead transforms when its condition is met.</div>'}
function lobby(msg){return '<section class="select"><div class="intro"><div class="small" style="letter-spacing:.18em;text-transform:uppercase;margin-bottom:9px">HANA TCG · FIRST ENCOUNTER</div><h1>FIVE MEMORIES.<br>ONE STORY.</h1><p>Learn the whole game in a single match, or jump straight into a real opponent.</p></div><div class="mode-grid"><button class="mode-card primary-mode" id="tutorialBtn"><div class="mode-kicker">Recommended · 8–12 min</div><div class="mode-title">LEARN WITH HANA →</div><div class="mode-copy">Hana vs Le. Rookie AI. The game teaches itself while you play.</div></button><div class="mode-card"><div class="mode-kicker">Already know it?</div><div class="mode-title">VS COMPUTER</div><div class="mode-copy">Choose Rookie, Rival or Weaver below.</div></div></div><div class="quick-rule"><div><b>1</b>Play cards to Scenes.</div><div><b>2</b>Have more Power.</div><div><b>5</b>Claim 5 Memories.</div></div><div class="notice" style="margin-top:12px"><b>QUICK MATCH</b><div class="row" style="margin-top:8px"><button class="btn" data-bot="rookie">Rookie</button><button class="btn primary" data-bot="rival">Rival</button><button class="btn" data-bot="weaver">Weaver</button></div><div class="small" style="margin-top:7px">Or tap <b>Invite friend</b> above and send this room link.</div></div></section>'}
function choose(v,msg){const keys=["hana","le","rei","firefly"],styles={hana:"Move first. Create pressure. Turn risk into tempo.",le:"Move the fight. Protect your position. Win the right Scene.",rei:"Build engines. Equip characters. Become harder to move.",firefly:"Disrupt plans. Exhaust threats. Win from unexpected angles."},tags={hana:"FAST · DIRECT · RISKY",le:"TACTICAL · FLUID · PATIENT",rei:"BUILD · SCALE · ENDURE",firefly:"TRICKS · CONTROL · ESCAPE"};const cards=keys.map(k=>{const d=v?.deckInfo?.[k]||{name:k.toUpperCase(),lead:"",element:k==="hana"?"flame":k==="le"?"tide":k==="rei"?"bloom":"veil",trigger:""};const mine=v&&v.you&&v.selectedDeck[v.you]===k;return '<button class="deck '+d.element+(mine?" locked":"")+'" data-deck="'+k+'" '+(!v||mine?"disabled":"")+'><div class="small">'+d.element.toUpperCase()+'</div><h3>'+esc(d.name)+'</h3><div>'+esc(d.lead)+'</div><div class="small" style="margin-top:8px;letter-spacing:.08em">'+tags[k]+'</div><div class="style">'+styles[k]+'</div><div class="small" style="margin-top:12px"><b>AWAKEN</b> · '+esc(d.trigger)+'</div></button>'}).join("");return '<section class="select"><div class="intro"><h1>CHOOSE YOUR HERO.</h1><p>Four starters. Same rules. Different instincts.</p></div>'+(msg.status==="waiting"?'<div class="notice">Waiting for your friend — or start immediately against the computer.<div class="row" style="margin-top:10px"><button class="btn" data-bot="rookie">ROOKIE</button><button class="btn primary" data-bot="rival">RIVAL</button><button class="btn" data-bot="weaver">WEAVER</button></div><div class="small" style="margin-top:7px"><b>Rookie</b> makes believable mistakes · <b>Rival</b> is the default · <b>Weaver</b> is threat-aware. None can see your hand.</div></div>':'')+(v?.opponentLocked?'<div class="notice">Your opponent has locked a starter. Their choice stays hidden until you lock yours.</div>':'')+'<div class="decks">'+cards+'</div></section>'}
function dock(v){if(!v.yourTurn)return '<div class="dock"><div class="dock-title">Opponent action</div><div class="small">They take one action, then you respond.</div></div>';const own=units(v,v.you),foe=units(v,v.opponent);let bs=[],h=v.hands.find(x=>x.uid===selHand);if(h){const c=v.cards[h.cardId];if(c.t==="character")v.scenes.forEach((s,i)=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-scene="'+i+'">Play to '+esc(s.name)+'</button>'));else if(c.t==="item")own.forEach(z=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'">Attach to '+esc(v.cards[z.u.cardId].n)+'</button>'));else if(c.target==="none")bs.push('<button data-act="play" data-uid="'+h.uid+'">Play '+esc(c.n)+'</button>');else if(c.target==="own")own.forEach(z=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'">'+esc(c.n)+' -> '+esc(v.cards[z.u.cardId].n)+'</button>'));else if(c.target==="enemy")foe.forEach(z=>bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'">'+esc(c.n)+' -> '+esc(v.cards[z.u.cardId].n)+'</button>'));else{const a=c.target==="ownMove"?own:foe;a.forEach(z=>v.scenes.forEach((s,i)=>{if(i!==z.si)bs.push('<button data-act="play" data-uid="'+h.uid+'" data-target="'+z.u.uid+'" data-scene="'+i+'">'+esc(v.cards[z.u.cardId].n)+' -> '+esc(s.name)+'</button>')}))}}else if(selUnit){const z=own.find(x=>x.u.uid===selUnit);if(z&&z.u.ready){v.scenes.forEach((s,i)=>{if(i!==z.si)bs.push('<button data-act="move" data-uid="'+z.u.uid+'" data-scene="'+i+'">Move -> '+esc(s.name)+'</button>')});v.scenes[z.si].units.filter(u=>u.owner===v.opponent).forEach(u=>bs.push('<button data-act="challenge" data-attacker="'+z.u.uid+'" data-target="'+u.uid+'">Challenge '+esc(v.cards[u.cardId].n)+'</button>'));bs.push('<button data-act="claim" data-uid="'+z.u.uid+'">Claim this Scene</button>')}}bs.push('<button data-act="pass">Pass</button>');if(!v.overdriveUsed[v.you])bs.push('<button data-act="overdrive">OVERDRIVE +2</button>');const detail=h?'<div class="small" style="margin:0 0 8px"><b>'+esc(v.cards[h.cardId].n)+'</b> · '+esc(v.cards[h.cardId].x)+'</div>':'';return '<div class="dock"><div class="dock-title">'+(h?'Selected card':selUnit?'Character actions':'Your action')+'</div>'+detail+'<div class="row">'+bs.join("")+'</div></div>'}
function coach(v,msg){const claim=v.scenes.findIndex((_,i)=>canClaim(v,i));let step=1,title="YOUR MOVE",copy="Tap a card in your hand. Affordable cards say PLAY.";if(claim>=0){step=3;title="CLAIM A MEMORY";copy="You control "+v.scenes[claim].name+". Tap a ready character there, then Claim this Scene."}else if(v.metrics?.[v.you]?.plays>0&&v.memories[v.you]===0){step=2;title="TAKE CONTROL";copy="Build more total Power than the opponent at a Scene. Move, play, or challenge to create an advantage."}else if(v.memories[v.you]>0&&!v.overdriveUsed[v.you]&&v.round>=2){step=4;title="OVERDRIVE WHEN IT MATTERS";copy="+2 Energy now, but your maximum will not grow next round. Use it to create a swing, not automatically."}else if(v.memories[v.you]>0){return msg.tutorial&&v.actionCount<18?'<div class="notice"><div class="coachline"><div class="coachstep">✓</div><div class="coachbody"><b>YOU KNOW THE LOOP</b>Control Scenes → Claim Memories → first to 5. Now make your own decisions.</div></div></div>':''}return '<div class="notice"><div class="coachline"><div class="coachstep">'+step+'</div><div class="coachbody"><b>'+title+'</b>'+copy+'</div></div></div>'}
function feedbackPanel(v,msg){if(feedbackSent)return '<div class="notice"><b>Feedback saved.</b> That is exactly the data this alpha needs.</div>';return '<div class="dock"><div class="dock-title">30-second playtest check</div><div class="small">Fun?</div><select id="funScore" class="btn" style="margin:5px 8px 9px 0"><option value="">1–5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><div class="small">Rules clear?</div><select id="clarityScore" class="btn" style="margin:5px 8px 9px 0"><option value="">1–5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><div class="small">Would you play another?</div><select id="rematchScore" class="btn" style="margin:5px 8px 9px 0"><option value="">Choose</option><option value="yes">Yes</option><option value="no">No</option></select><div><button class="btn primary" id="feedbackBtn">Send feedback</button></div></div>'}
function summary(v,msg){if(msg.status!=="over")return '';const mine=v.memories[v.you],theirs=v.memories[v.opponent],m=v.metrics?.[v.you]||{},won=msg.result?.winner===v.you,tip=(m.claims||0)<3?"Next game: fight for claims earlier — Memories win, not KOs.":(m.challenges||0)===0?"Next game: try challenging a key blocker instead of only building wider.":(m.overdrives||0)===0?"Next game: look for one decisive Overdrive turn.":"You used the core tools. Now try another hero and notice how the same board feels different.";return '<div class="notice"><b>'+(won?"VICTORY":"MATCH COMPLETE")+'</b> · '+mine+'–'+theirs+' Memories · '+v.round+' rounds'+(msg.firstActionMs? ' · first move '+Math.max(1,Math.round(msg.firstActionMs/1000))+'s':'')+'<div class="result-grid"><div class="result-stat"><b>'+(m.plays||0)+'</b><span>Cards</span></div><div class="result-stat"><b>'+(m.claims||0)+'</b><span>Claims</span></div><div class="result-stat"><b>'+(m.challenges||0)+'</b><span>Fights</span></div><div class="result-stat"><b>'+(m.transforms||0)+'</b><span>Awaken</span></div></div><div class="next-tip">'+tip+'</div></div>'+feedbackPanel(v,msg)}
function render(msg){last=msg;const v=msg.view;if(!v){root.innerHTML=(rulesOpen?rules():"")+lobby(msg);handMount.innerHTML="";bind();return}if(v.phase==="choose"){root.innerHTML=(rulesOpen?rules():"")+choose(v,msg)+(errorText?'<div class="notice" style="color:#ff756f">'+esc(errorText)+'</div>':'');handMount.innerHTML="";bind();return}const p1=v.you,p2=v.opponent,status=msg.status==="over"?(msg.result?.winner===v.you?"YOU WON THE FIFTH MEMORY":v.opponent==="BOT"?"COMPUTER CLAIMED FIVE":"YOUR FRIEND WON"):(v.yourTurn?"YOUR ACTION":v.opponent==="BOT"?"COMPUTER THINKING":"OPPONENT ACTION");root.innerHTML=(rulesOpen?rules():"")+coach(v,msg)+'<div class="bar">'+playerHTML(v,p1,false)+'<div class="status">'+status+'<div class="small">Round '+v.round+(errorText?' | <span style="color:#ff756f">'+esc(errorText)+'</span>':'')+'</div></div>'+playerHTML(v,p2,true)+'</div>'+sceneNav(v)+'<div class="table" id="sceneTable">'+v.scenes.map((s,si)=>'<section class="scene '+(canClaim(v,si)?'claimable':'')+'" data-scene-index="'+si+'"><div class="scene-head"><div class="scene-name">'+esc(s.name)+'</div><div class="scene-rule">'+esc(s.text)+'</div></div><div class="zone foe"><div class="zone-title"><span>Opponent</span><span>P '+total(v,p2,si)+'</span></div><div class="units">'+s.units.filter(u=>u.owner===p2).map(u=>unitHTML(v,u,si,false)).join("")+'</div></div><div class="zone"><div class="zone-title"><span>You</span><span>P '+total(v,p1,si)+'</span></div><div class="units">'+s.units.filter(u=>u.owner===p1).map(u=>unitHTML(v,u,si,true)).join("")+'</div></div></section>').join("")+'</div>'+dock(v)+'<div class="log">'+v.log.map(x=>'<span>'+esc(x)+'</span>').join("")+'</div>'+summary(v,msg)+(msg.status==="over"?'<div class="dock"><button class="btn primary" data-reset>Play again</button></div>':'');handMount.innerHTML='<div class="hand-wrap"><div class="hand-label">YOUR HAND · '+v.energy[v.you]+' ENERGY</div><div class="hand">'+v.hands.map(x=>cardHTML(v,x)).join("")+'</div></div>';bind()}
async function act(action){try{busy=true;errorText="";render(await api({op:"action",action}))}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}}
function bind(){const tut=document.querySelector("#tutorialBtn");if(tut)tut.addEventListener("click",async()=>{try{busy=true;render(await api({op:"tutorial"}))}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}});document.querySelectorAll("[data-scene-nav]").forEach(b=>b.addEventListener("click",()=>{activeScene=Number(b.dataset.sceneNav)||0;const el=document.querySelector('[data-scene-index="'+activeScene+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});document.querySelectorAll("[data-scene-nav]").forEach(x=>x.classList.toggle("active",x===b))}));document.querySelectorAll("[data-bot]").forEach(bot=>bot.addEventListener("click",async()=>{try{busy=true;render(await api({op:"bot",difficulty:bot.dataset.bot}))}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}}));const fb=document.querySelector("#feedbackBtn");if(fb)fb.addEventListener("click",async()=>{const fun=Number(document.querySelector("#funScore")?.value),clarity=Number(document.querySelector("#clarityScore")?.value),rv=document.querySelector("#rematchScore")?.value;if(!fun||!clarity||!rv){errorText="Please answer all three playtest questions.";render(last);return}try{busy=true;await api({op:"feedback",funScore:fun,clarityScore:clarity,rematch:rv==="yes"});feedbackSent=true;errorText="";render(last)}catch(e){errorText=e.message;render(last)}finally{busy=false}});document.querySelectorAll("[data-deck]").forEach(b=>b.addEventListener("click",()=>act({type:"selectDeck",deck:b.dataset.deck})));document.querySelectorAll("[data-card]").forEach(b=>b.addEventListener("click",()=>{selUnit=null;selHand=selHand===b.dataset.card?null:b.dataset.card;render(last)}));document.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",()=>{selHand=null;selUnit=selUnit===b.dataset.unit?null:b.dataset.unit;render(last)}));document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{const a={type:b.dataset.act};for(const k of ["uid","target","attacker"])if(b.dataset[k])a[k]=b.dataset[k];if(b.dataset.scene!==undefined)a.scene=Number(b.dataset.scene);selHand=null;selUnit=null;act(a)}));document.querySelectorAll("[data-reset]").forEach(b=>b.addEventListener("click",async()=>{try{feedbackSent=false;render(await api({op:"reset"}))}catch(e){errorText=e.message}}))}
document.querySelector("#rulesBtn").addEventListener("click",()=>{rulesOpen=!rulesOpen;if(last)render(last)});
document.querySelector("#inviteBtn").addEventListener("click",async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:"HANA TCG LAB",text:"Play a HANA match with me.",url:u});else if(navigator.clipboard){await navigator.clipboard.writeText(u);alert("Invite link copied.")}else prompt("Send this link to your friend:",u)}catch{}});
async function boot(){try{render(await api({op:"join"}))}catch(e){root.innerHTML='<div class="notice">Could not join: '+esc(e.message)+'</div>'}}
setInterval(async()=>{if(busy)return;try{const s=await api({op:"state"});if(JSON.stringify(s)!==JSON.stringify(last))render(s)}catch{}},800);boot();
</script></body></html>
