 const claimable=v.scenes.map((_,i)=>i).find(i=>canClaim(v,i));
 if(v.memories[v.you]===0&&claimable!==undefined){
   const yp=scenePower(v,v.you,claimable),op=scenePower(v,v.opponent,claimable),name=v.scenes[claimable].name;
   return '<div class="coach"><div><b>2 · CONTROL → CLAIM</b>You have '+yp+' Power vs '+op+' at <strong>'+esc(name)+'</strong>. More Power means you control it. Tap a ready character there, then Claim.</div></div>';
 }
 if(v.memories[v.you]===0)return '<div class="coach"><div><b>2 · CONTROL</b>To score, create more total Power than Le at one Scene. Play, Move, or Challenge to change the numbers.</div></div>';
 if(v.memories[v.you]<5&&v.round<=3)return '<div class="coach"><div><b>3 · CLAIM 5</b>You have <strong>'+v.memories[v.you]+' / 5 Memories</strong>. Keep controlling Scenes and claiming once per round.</div></div>';
 if(!v.overdriveUsed[v.you]&&v.round>=2)return '<div class="coach"><div><b>OPTIONAL · OVERDRIVE</b>+2 Energy now can create a swing. The tradeoff: your max Energy will not grow next round.</div></div>';
 return "";
}
function hand(v){
 return '<section class="hand-section"><div class="hand-head"><strong>YOUR HAND · '+v.handCount[v.you]+' CARDS</strong><span class="energy">'+v.energy[v.you]+' Energy</span></div><div class="hand-row">'+v.hands.map(x=>cardHTML(v,x)).join("")+'</div></section>';
}
function tools(v){
 return '<div class="turn-tools"><button class="btn" data-action="overdrive" '+(!v.yourTurn||v.overdriveUsed[v.you]?'disabled':'')+'>Overdrive +2</button><button class="btn" data-action="pass" '+(!v.yourTurn?'disabled':'')+'>Pass</button></div>';
}
function feedback(v,msg){
 if(feedbackSent)return '<div class="notice"><b>Feedback saved.</b> Thank you — this is exactly what v0.12.1 needs.</div>';
 return '<div class="feedback"><div class="eyebrow">30-SECOND PLAYTEST</div><div class="feedback-grid"><select id="fun"><option value="">Fun 1–5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="clear"><option value="">Clarity 1–5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="again"><option value="">Play again?</option><option value="yes">Yes</option><option value="no">No</option></select><input id="remember" maxlength="80" placeholder="Which card do you remember most? (optional)" autocomplete="off"><button class="btn primary" data-ui="feedback">Send feedback</button></div></div>';
}
function yourMoment(v,m){
 const plays=Object.entries(m.cardPlays||{}).sort((a,b)=>b[1]-a[1]),id=plays[0]?.[0],c=id?v.cards[id]:null;
 if(c)return '<div class="your-moment"><div class="moment-art">'+conceptArt(id,c,true)+'</div><div><div class="eyebrow">YOUR MOMENT</div><b>'+esc(c.n)+'</b><span>'+(plays[0][1]>1?'You played it '+plays[0][1]+' times. ':'')+(c.fl?'“'+esc(c.fl)+'”':'')+'</span></div></div>';
 if((m.transforms||0)>0)return '<div class="your-moment text"><div><div class="eyebrow">YOUR MOMENT</div><b>You Awakened.</b><span>Your Lead transformed during the match.</span></div></div>';
 return '<div class="your-moment text"><div><div class="eyebrow">YOUR MOMENT</div><b>'+((m.claims||0)>0?'You claimed '+m.claims+' Memories.':'You finished your first HANA match.')+'</b><span>The next game will already feel different.</span></div></div>';
}
function result(v,msg){
 if(msg.status!=="over")return "";
 const m=v.metrics?.[v.you]||{},win=msg.result?.winner===v.you,score=v.memories[v.you]+"–"+v.memories[v.opponent];
 const tip=(m.claims||0)<3?"Next match: prioritize Memories over simply building the biggest board.":(m.challenges||0)===0?"Next match: try removing one key blocker with a Challenge.":(m.overdrives||0)===0?"Next match: look for one decisive Overdrive turn.":"You used the full core loop. Try a different hero next.";
 return '<section class="result"><div class="eyebrow">MATCH '+msg.matchNumber+'</div><h2>'+(win?'Victory':'Match complete')+' · '+score+'</h2><div class="result-meta">'+v.round+' rounds · '+v.actionCount+' actions'+(msg.firstActionMs?' · first move '+Math.max(1,Math.round(msg.firstActionMs/1000))+'s':'')+'</div>'+yourMoment(v,m)+'<div class="result-grid"><div class="result-stat"><b>'+(m.signatures||0)+'</b><span>Signatures</span></div><div class="result-stat"><b>'+(m.claims||0)+'</b><span>Claims</span></div><div class="result-stat"><b>'+(m.challenges||0)+'</b><span>Fights</span></div><div class="result-stat"><b>'+(m.transforms||0)+'</b><span>Awaken</span></div></div><div class="notice">'+tip+'</div>'+feedback(v,msg)+'<div class="result-actions"><button class="btn primary" data-ui="reset">Rematch</button><button class="btn" data-ui="home">Try another hero</button></div></section>';
}
function inspectPanel(msg){
 if(!inspectCardId)return "";
 const cards=msg?.catalog?.cards||msg?.view?.cards||msg?.draft?.cards||{},c=cards[inspectCardId];if(!c)return "";
 const entry=(msg?.catalog?.binder||[]).find(x=>x.id===inspectCardId),r=rarityOf(c),stats=c.t==="character"?"P "+c.p+" · HP "+c.h:c.t==="item"?"ITEM":"MOMENT";
 return '<div class="inspect-backdrop"><article class="inspect-card"><button class="btn small inspect-close" data-ui="inspect-close">Close</button>'+
 '<div class="inspect-art">'+conceptArt(inspectCardId,c,false)+'</div><div class="inspect-body"><div class="inspect-kicker">'+(entry?entry.s1+" · ":"")+rarityName(r)+' · '+ccolors(c).map(x=>colorName[x]).join(" / ")+' · '+esc(c.t)+'</div>'+
 '<div class="inspect-title">'+esc(c.n)+'</div><div class="inspect-kicker">'+stats+' · COST '+c.c+'</div><div class="inspect-rule">'+esc(c.x||"")+'</div>'+
 (c.fl?'<div class="inspect-flavor">“'+esc(c.fl)+'”</div>':'')+'</div></article></div>';
}
function binderScreen(msg){
 const cat=msg?.catalog;if(!cat)return shellTop()+'<div class="notice">Binder data is loading…</div>';
 const binder=cat.binder||[],pageN=Math.max(0,Math.min(19,binderPage)),entries=binder.slice(pageN*9,pageN*9+9),seen=new Set(loadCollection().seen||[]),playable=binder.filter(x=>x.playable),seenCount=playable.filter(x=>seen.has(x.id)).length;
 const chapter=entries[0]?.act||"Season 1";
 return shellTop()+(rulesOpen?rules():"")+'<main class="binder-wrap"><div class="binder-head"><div><div class="eyebrow">COLLECTION ALPHA · SEASON 1</div><h1>Memory Binder</h1><div class="small">'+esc(chapter)+'</div></div><div class="binder-stats"><b>'+seenCount+' / '+playable.length+'</b><br>playable cards discovered<br><span>180 story slots</span></div></div>'+
 '<div class="binder-nav"><button class="btn" data-binder-page="'+Math.max(0,pageN-1)+'" '+(pageN===0?'disabled':'')+'>←</button><div class="binder-chapter">PAGE '+(pageN+1)+' / 20 · '+esc(chapter)+'</div><button class="btn" data-binder-page="'+Math.min(19,pageN+1)+'" '+(pageN===19?'disabled':'')+'>→</button></div>'+
 '<div class="binder-grid">'+entries.map(e=>{if(e.playable){const c=cat.cards[e.id],isSeen=seen.has(e.id);return '<button class="binder-slot playable '+(isSeen?'seen':'')+'" data-binder-card="'+e.id+'">'+conceptArt(e.id,c,false)+'<div class="binder-slot-copy"><div class="binder-slot-id">'+e.s1+' · '+rarityName(e.rarity)+'</div><div class="binder-slot-title">'+esc(e.title)+'</div></div><div class="binder-slot-state">'+(isSeen?'DISCOVERED':'UNSEEN')+'</div></button>'}if(e.kind)return '<div class="binder-slot canonical '+(e.element||'')+'"><div class="binder-lock">'+(e.kind==="lead"?'✦':'⌂')+'</div><div class="binder-slot-copy"><div class="binder-slot-id">'+e.s1+' · '+esc(e.kind.toUpperCase())+'</div><div class="binder-slot-title">'+esc(e.title)+'</div>'+(e.flavor?'<div class="binder-slot-flavor">“'+esc(e.flavor)+'”</div>':'')+'</div><div class="binder-slot-state">CANON</div></div>';return '<div class="binder-slot planned"><div class="binder-lock">◇</div><div class="binder-slot-copy"><div class="binder-slot-id">'+e.s1+'</div><div class="binder-slot-title">'+esc(e.title)+'</div></div><div class="binder-slot-state">SEASON 1</div></div>'}).join("")+'</div>'+
 '<div class="notice" style="margin-top:10px"><b>Collection Alpha:</b> cards become “discovered” when you see them in your hand, battlefield or Draft. This is local-device persistence for v0.12.1; account sync is a v1.0 gate.</div></main>';
}
function game(v,msg){
 const log=v.log?.[0]||"";
 if(msg.status==="over")return shellTop()+(rulesOpen?rules():"")+hud(v,msg)+result(v,msg)+sceneTabs(v)+scene(v)+(log?'<div class="last-action">Final action · '+esc(log)+'</div>':'')+(errorText?'<div class="notice">'+esc(errorText)+'</div>':'');
 return shellTop()+(rulesOpen?rules():"")+'<div class="play-shell"><div class="play-board">'+hud(v,msg)+coach(v,msg)+sceneTabs(v)+scene(v)+'</div><div class="play-action">'+context(v)+tools(v)+'</div><div class="play-hand">'+hand(v)+'</div></div>'+(log?'<div class="last-action">Last action · '+esc(log)+'</div>':'')+(errorText?'<div class="notice">'+esc(errorText)+'</div>':'');
}

function paint(html,msg){root.innerHTML=html+(inspectCardId?inspectPanel(msg):"")}
function render(msg){
 last=msg;if(msg.status==="over"&&!firstRunDone())markFirstRunDone();discoverFromMessage(msg);const v=msg.view;
 if(binderOpen){paint(binderScreen(msg),msg);return}
 if(msg.status==="drafting"&&msg.draft){paint(draftScreen(msg),msg);return}
 if(!v){paint(draftSetupOpen?draftSetup(msg):lobby(msg),msg);return}
 if(v.phase==="choose"){paint(deckLabOpen?deckLab(v,msg):chooseDeck(v,msg),msg);return}
 paint(game(v,msg),msg);
}
function clearSelection(){selectedCard=null;selectedUnit=null;pendingTarget=null;mode=null}
function revealContext(){requestAnimationFrame(()=>{const el=document.querySelector(".context");if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"})})}
function actionFeedback(before,after,action){
 const bv=before?.view,av=after?.view,you=av?.you;if(!bv||!av||!you)return;
 const gained=(av.memories?.[you]||0)>(bv.memories?.[you]||0),awakened=!bv.form?.[you]&&!!av.form?.[you];
 if(gained)haptic([14,24,18]);else if(awakened)haptic([10,18,10,28]);else if(action?.type==="challenge")haptic([18]);else if(action?.type==="play")haptic([8]);else if(action?.type==="move")haptic([6]);
}
async function act(action){
 if(busy)return;const before=last;
 try{busy=true;errorText="";setBusy(action?.type==="claim"?"CLAIMING MEMORY…":"RESOLVING MOVE…");const msg=await api({op:"action",action});actionFeedback(before,msg,action);clearSelection();render(msg)}
 catch(e){errorText=e.message;if(last)render(last)}
 finally{busy=false;setBusy("")}
}
async function startBot(diff){
 if(busy)return;try{busy=true;errorText="";setBusy("SETTING THE TABLE…");render(await api({op:"bot",difficulty:diff}))}
 catch(e){errorText=e.message;if(last)render(last)}
 finally{busy=false;setBusy("")}
}
async function startDraft(pair,lead){
 if(busy)return;try{busy=true;errorText="";draftSetupOpen=false;setBusy("BUILDING THE DRAFT…");render(await api({op:"draftStart",pair,lead,difficulty:"rival"}))}
 catch(e){errorText=e.message;draftSetupOpen=true;render(last)}
 finally{busy=false;setBusy("")}
}
async function draftPick(id){
 if(busy)return;document.querySelectorAll("[data-draft-pick]").forEach(x=>x.disabled=true);
 try{busy=true;errorText="";setBusy("AI IS PICKING…");render(await api({op:"draftPick",cardId:id}));haptic([6])}
 catch(e){errorText=e.message;render(last)}
 finally{busy=false;setBusy("")}
}
async function startTutorial(){
 if(busy)return;try{busy=true;errorText="";clearSelection();setBusy("SETTING THE TABLE…");render(await api({op:"tutorial"}));haptic([7])}
 catch(e){errorText=e.message;if(last)render(last)}
 finally{busy=false;setBusy("")}
}
async function goHome(){
 if(busy)return;try{
  busy=true;setBusy("OPENING A NEW TABLE…");markFirstRunDone();room=crypto.randomUUID().replaceAll("-","");history.replaceState(null,"",location.pathname+"?room="+room);
  last=null;rulesOpen=false;activeScene=0;clearSelection();feedbackSent=false;errorText="";deckLabOpen=false;draftSetupOpen=false;binderOpen=false;inspectCardId=null;
  render(await api({op:"join"}));
 }catch(e){errorText=e.message;if(last)render(last)}
 finally{busy=false;setBusy("")}
}
async function shareRoom(){const u=location.href;try{if(navigator.share)await navigator.share({title:"HANA TCG",text:"Control Scenes. Claim 5 Memories. Want a match?",url:u});else if(navigator.clipboard){await navigator.clipboard.writeText(u);errorText="Room link copied.";render(last)}else prompt("Send this room link:",u)}catch{}}

root.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.ui==="rules"){rulesOpen=!rulesOpen;render(last);return}
 if(b.dataset.ui==="binder"){binderOpen=!binderOpen;inspectCardId=null;render(last);return}
 if(b.dataset.ui==="inspect-close"){inspectCardId=null;render(last);return}
 if(b.dataset.binderPage!==undefined){binderPage=Math.max(0,Math.min(19,Number(b.dataset.binderPage)||0));render(last);return}
 if(b.dataset.binderCard){inspectCardId=b.dataset.binderCard;render(last);return}
 if(b.dataset.ui==="share"){await shareRoom();return}
 if(b.dataset.ui==="draft-setup"){draftSetupOpen=true;errorText="";render(last);return}
 if(b.dataset.ui==="draft-back"){draftSetupOpen=false;errorText="";render(last);return}
 if(b.dataset.draftStart){await startDraft(b.dataset.draftStart.split("|"),b.dataset.draftLead);return}
 if(b.dataset.draftPick){await draftPick(b.dataset.draftPick);return}
 if(b.dataset.ui==="tutorial"){await startTutorial();return}
 if(b.dataset.ui==="bot"){await startBot(b.dataset.diff||"rival");return}
 if(b.dataset.ui==="clear"){clearSelection();render(last);return}
 if(b.dataset.ui==="decklab"){deckLabOpen=true;if(!Object.keys(labCounts).length)autoBuild(last.view);render(last);return}
 if(b.dataset.ui==="decklab-back"){deckLabOpen=false;errorText="";render(last);return}
 if(b.dataset.labLead){labLead=b.dataset.labLead;labColors=[last.view.deckInfo[labLead].element];autoBuild(last.view);errorText="";render(last);return}
 if(b.dataset.labColor){
   const primary=last.view.deckInfo[labLead].element,x=b.dataset.labColor;
   if(x===primary)return;
   if(labColors.includes(x))labColors=labColors.filter(c=>c!==x);
   else if(labColors.length<3)labColors.push(x);
   else{errorText="Maximum 3 colors.";render(last);return}
   autoBuild(last.view);errorText="";render(last);return
 }
 if(b.dataset.ui==="lab-auto"){autoBuild(last.view);errorText="";render(last);return}
 if(b.dataset.ui==="lab-clear"){labCounts={};errorText="";render(last);return}
 if(b.dataset.labPlus){const id=b.dataset.labPlus;if(eligibleForLab(last.view.cards[id])&&(labCounts[id]||0)<2)labCounts[id]=(labCounts[id]||0)+1;render(last);return}
 if(b.dataset.labMinus){const id=b.dataset.labMinus;if((labCounts[id]||0)>0)labCounts[id]--;render(last);return}
 if(b.dataset.ui==="lab-submit"){
   const st=labStatus(last.view);if(!st.ok)return;
   try{busy=true;errorText="";const msg=await api({op:"action",action:{type:"selectCustomDeck",lead:labLead,cards:labList()}});deckLabOpen=false;clearSelection();render(msg)}catch(e){errorText=e.message;render(last)}finally{busy=false}return
 }
 if(b.dataset.deck){await act({type:"selectDeck",deck:b.dataset.deck});return}
 if(b.dataset.scene!==undefined){activeScene=Math.max(0,Math.min(2,Number(b.dataset.scene)||0));render(last);return}
 if(b.dataset.card){
   const v=last.view,x=v.hands.find(x=>x.uid===b.dataset.card);if(!x)return;
   if(selectedCard?.uid===x.uid){inspectCardId=x.cardId;render(last);return}
   selectedUnit=null;pendingTarget=null;mode=null;selectedCard=x;render(last);revealContext();return;
 }
 if(b.dataset.playCard){
   const a={type:"play",uid:b.dataset.playCard};if(b.dataset.playScene!==undefined)a.scene=Number(b.dataset.playScene);await act(a);return;
 }
 if(b.dataset.unit){
   const v=last.view,z=locOf(v,b.dataset.unit);if(!z)return;
   if(selectedCard){
     const c=v.cards[selectedCard.cardId];
     const own=z.u.owner===v.you;
     if(c.t==="item"&&own){await act({type:"play",uid:selectedCard.uid,target:z.u.uid});return}
     if(c.target==="own"&&own){await act({type:"play",uid:selectedCard.uid,target:z.u.uid});return}
     if(c.target==="enemy"&&!own){await act({type:"play",uid:selectedCard.uid,target:z.u.uid});return}
     if((c.target==="ownMove"&&own)||(c.target==="enemyMove"&&!own)){pendingTarget=z.u.uid;render(last);revealContext();return}
     return;
   }
   if(mode==="challenge"&&selectedUnit&&z.u.owner===v.opponent){await act({type:"challenge",attacker:selectedUnit,target:z.u.uid});return}
   if(z.u.owner===v.you){selectedUnit=selectedUnit===z.u.uid?null:z.u.uid;mode=null;render(last);revealContext()}return;
 }
 if(b.dataset.moveEffect!==undefined&&selectedCard&&pendingTarget){await act({type:"play",uid:selectedCard.uid,target:pendingTarget,scene:Number(b.dataset.moveEffect)});return}
 if(b.dataset.moveUnit!==undefined&&selectedUnit){await act({type:"move",uid:selectedUnit,scene:Number(b.dataset.moveUnit)});return}
 if(b.dataset.unitAction==="claim"&&selectedUnit){await act({type:"claim",uid:selectedUnit});return}
 if(b.dataset.ui==="challenge"){mode="challenge";render(last);revealContext();return}
 if(b.dataset.action){await act({type:b.dataset.action});return}
 if(b.dataset.ui==="reset"){try{feedbackSent=false;clearSelection();render(await api({op:"reset"}))}catch(e){errorText=e.message;render(last)}return}
 if(b.dataset.ui==="feedback"){
   const fun=Number(document.querySelector("#fun")?.value),clarity=Number(document.querySelector("#clear")?.value),again=document.querySelector("#again")?.value;
   if(!fun||!clarity||!again){errorText="Please answer all three playtest questions.";render(last);return}
   try{await api({op:"feedback",funScore:fun,clarityScore:clarity,rematch:again==="yes"});feedbackSent=true;errorText="";render(last)}catch(e){errorText=e.message;render(last)}return;
 }
});
async function boot(){try{render(await api({op:"join"}))}catch(e){root.innerHTML=shellTop()+'<div class="notice">Could not join: '+esc(e.message)+'</div>'}}
setInterval(async()=>{if(busy)return;try{const msg=await api({op:"state"});if(!last||msg.version!==last.version||msg.status!==last.status)render(msg)}catch{}},900);
boot();
</script>
</body>
