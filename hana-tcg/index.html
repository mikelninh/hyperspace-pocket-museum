<style>

.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand-mark{width:25px;height:25px;border-radius:50%;background:conic-gradient(var(--flame),var(--veil),var(--tide),var(--bloom),var(--flame));box-shadow:inset 0 0 0 6px #10121a;flex:0 0 auto}.brand strong{letter-spacing:.12em;font-size:12px}.version{font-size:9px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px}

.hud{border:1px solid var(--line);background:#0f1219;border-radius:15px;padding:10px;margin-bottom:9px}.turnline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.turnstate{font-weight:950;font-size:12px;letter-spacing:.09em}.round{font-size:10px;color:var(--muted)}
.players{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.versus{font-size:9px;color:#565d6d;font-weight:900}.playerbox{min-width:0}.playerbox.right{text-align:right}.playername{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-meta{font-size:10px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.playerbox.right .player-meta{justify-content:flex-end}
.pips{display:inline-flex;gap:3px}.pips i{display:block;width:8px;height:8px;border-radius:50%;border:1px solid #efc66b80}.pips i.on{background:var(--gold);border-color:var(--gold)}
.scene-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:9px 0}.scene-tab{min-height:48px;border:1px solid var(--line);background:#11141c;border-radius:11px;padding:5px 6px;text-align:left;min-width:0}.scene-tab.active{border-color:#ffffff66;background:#171b25}.scene-tab.claimable{border-color:#efc66baa}.scene-tab strong{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scene-tab span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.scene-tab.claimable span{color:var(--gold)}
.scene-card{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#0f1219}.scene-head{padding:12px 13px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#191c27,#10121a)}.scene-head.flame{background:radial-gradient(circle at 90% 0,#ef5a7026,transparent 42%),linear-gradient(135deg,#18141a,#10121a)}.scene-head.tide{background:radial-gradient(circle at 90% 0,#5fa9ef26,transparent 42%),linear-gradient(135deg,#121927,#10121a)}.scene-head.veil{background:radial-gradient(circle at 90% 0,#ad7be826,transparent 42%),linear-gradient(135deg,#181426,#10121a)}.scene-title{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.scene-title h2{font-size:14px;margin:0}.scene-rule{font-size:10px;color:var(--muted);margin-top:5px}.lead-state{font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap}.lead-state.you{color:var(--gold)}
.zone{padding:10px 11px}.zone+ .zone{border-top:1px solid #ffffff12}.zone-label{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.unit-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:74px}.unit-row::-webkit-scrollbar,.hand-row::-webkit-scrollbar{display:none}.empty{width:100%;display:grid;place-items:center;color:#454b59;font-size:9px;letter-spacing:.12em}
.unit{flex:0 0 112px;min-height:75px;border:1px solid #ffffff1d;border-left-width:2px;background:#171b25;border-radius:10px;padding:7px;text-align:left;position:relative}.unit.flame{border-left-color:var(--flame)}.unit.tide{border-left-color:var(--tide)}.unit.bloom{border-left-color:var(--bloom)}.unit.veil{border-left-color:var(--veil)}.unit.exhausted{opacity:.52}.unit.selected{outline:2px solid #fff;outline-offset:1px}.unit.target{outline:2px solid var(--gold);outline-offset:1px}.unit-name{font-size:10px;font-weight:850;line-height:1.15;min-height:25px}.unit-stats{font-size:10px;font-weight:900;margin-top:8px}.unit-stats .p{color:#f0d386}.unit-stats .h{color:#ed8794}.unit-state{position:absolute;right:6px;bottom:5px;font-size:8px;color:var(--muted)}
.power-meter{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid #ffffff12;border-bottom:1px solid #ffffff12;background:#0c0f15}.power-meter div:first-child{text-align:left}.power-meter div:last-child{text-align:right}.power-meter b{font-size:18px}.power-meter span{font-size:9px;color:var(--muted)}.power-message{font-size:10px;font-weight:850;color:var(--muted);text-align:center}.power-message.you{color:var(--gold)}
.context{border:1px solid var(--line);border-radius:15px;background:#121620;padding:11px;margin:9px 0}.context-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}.context-copy{font-size:12px;color:#daddE4;margin-bottom:9px}.context-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.context-actions .btn.full{grid-column:1/-1}.context-actions .btn{padding:0 9px}
.hand-section{margin:10px 0}.hand-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px}.hand-head strong{font-size:10px;letter-spacing:.12em}.energy{font-size:11px;color:var(--gold);font-weight:900}.hand-row{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 5px;scroll-snap-type:x proximity}
.card{flex:0 0 126px;height:174px;border:1px solid #ffffff24;border-radius:12px;background:#131721;overflow:hidden;position:relative;text-align:left;scroll-snap-align:start}.card.flame{border-color:#ef5a7050}.card.tide{border-color:#5fa9ef50}.card.bloom{border-color:#69c99a50}.card.veil{border-color:#ad7be850}.card.disabled{opacity:.5}.card.selected{outline:2px solid #fff;outline-offset:1px;transform:translateY(-1px)}.card-art{height:55px;display:grid;place-items:center;position:relative}.card.flame .card-art{background:linear-gradient(145deg,#65232f,#171117)}.card.tide .card-art{background:linear-gradient(145deg,#183b61,#101720)}.card.bloom .card-art{background:linear-gradient(145deg,#174631,#101713)}.card.veil .card-art{background:linear-gradient(145deg,#422361,#17101d)}.glyph{width:29px;height:29px;color:#fff}.playtag{position:absolute;left:5px;top:5px;font-size:7px;font-weight:900;letter-spacing:.08em;border:1px solid #ffffff38;border-radius:99px;padding:2px 4px;background:#090a0fcf}.card-cost{position:absolute;right:6px;top:61px;width:24px;height:24px;border:1px solid #ffffff2d;background:#090b10;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:950}.card.disabled .card-cost{color:#ed8794;border-color:#ed879477}.card-body{padding:7px}.card-name{font-size:10px;font-weight:900;line-height:1.1;padding-right:22px;min-height:23px}.card-type{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0}.card-text{font-size:8px;color:#d0d3dc;line-height:1.22}.card-foot{position:absolute;bottom:6px;left:7px;right:7px;display:flex;justify-content:space-between;font-size:9px;font-weight:900}
.turn-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.turn-tools .btn{font-size:12px}.last-action{font-size:10px;color:var(--muted);padding:7px 2px}
.coach{display:flex;gap:9px;align-items:flex-start;border-left:2px solid var(--gold);padding:7px 9px;margin:8px 0;color:var(--muted);font-size:11px}.coach b{display:block;color:var(--text);margin-bottom:2px}
.rules{border:1px solid var(--line);border-radius:15px;background:#11141c;padding:12px;margin:8px 0;color:var(--muted);font-size:12px}.rules b{color:var(--text)}
.result{border:1px solid var(--line);border-radius:16px;background:#11141c;padding:13px;margin:10px 0}.result h2{font-size:20px;margin:0 0 4px}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.result-stat{border:1px solid var(--line);border-radius:9px;padding:7px 3px;text-align:center}.result-stat b{display:block;font-size:16px}.result-stat span{font-size:8px;color:var(--muted);text-transform:uppercase}.feedback{border-top:1px solid var(--line);margin-top:11px;padding-top:10px}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.feedback select{min-height:44px;border:1px solid var(--line);background:#171b25;border-radius:10px;padding:0 8px}.feedback .btn{grid-column:1/-1}
@media(min-width:600px){#root{padding-left:18px;padding-right:18px}.deck-list{grid-template-columns:1fr 1fr}.mode{grid-template-columns:1.3fr .7fr}.mode-row{align-self:stretch;grid-template-columns:1fr}.context-actions{grid-template-columns:repeat(3,1fr)}.context-actions .btn.full{grid-column:auto}.card{flex-basis:138px;height:185px}.card-art{height:62px}.card-cost{top:68px}}
@media(max-width:350px){#root{padding-left:8px;padding-right:8px}.players{gap:5px}.playername{font-size:10px}.scene-tab{padding:5px}.scene-tab strong{font-size:8px}.context-actions{grid-template-columns:1fr}.context-actions .btn.full{grid-column:auto}.card{flex-basis:118px}.mode-row{grid-template-columns:1fr}.rule-strip{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<main id="root" aria-live="polite">Loading HANA…</main>
<script>
const API="https://rqloovqablskjjylobdh.supabase.co/functions/v1/hana-tcg";
let room=new URLSearchParams(location.search).get("room");
if(!room){room=crypto.randomUUID().replaceAll("-","");history.replaceState(null,"",location.pathname+"?room="+room)}
const PK="hana-tcg-player";let player=localStorage.getItem(PK);if(!player){player=crypto.randomUUID();localStorage.setItem(PK,player)}
const root=document.querySelector("#root");
let last=null,busy=false,rulesOpen=false,activeScene=0,selectedCard=null,selectedUnit=null,pendingTarget=null,mode=null,feedbackSent=false,errorText="";

async function api(body){
 const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...body,room,player})});
 const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function deck(v,p){const k=v.selectedDeck?.[p];return k?v.deckInfo[k]:null}
function dots(n){return '<span class="pips" aria-label="'+n+' of 5 Memories">'+[0,1,2,3,4].map(i=>'<i class="'+(i<n?'on':'')+'"></i>').join("")+'</span>'}
function elementGlyph(e){
 if(e==="flame")return '<svg class="glyph" viewBox="0 0 32 32"><path d="M18 3c1 6-4 7-2 12 1-3 4-4 5-7 5 6 6 11 3 16-3 5-12 7-17 1-5-7 1-13 6-18 0 5 2 7 5 8-1-4 1-7 0-12Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
 if(e==="tide")return '<svg class="glyph" viewBox="0 0 32 32"><path d="M3 12c4-5 8-5 12 0s8 5 14 0M3 20c4-5 8-5 12 0s8 5 14 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
 if(e==="bloom")return '<svg class="glyph" viewBox="0 0 32 32"><path d="M16 16C7 15 5 8 7 4c6 0 9 4 9 12Zm0 0c9-1 11-8 9-12-6 0-9 4-9 12Zm0 0c-6 3-7 9-5 12 4 0 6-4 5-12Zm0 0c6 3 7 9 5 12-4 0-6-4-5-12Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
 return '<svg class="glyph" viewBox="0 0 32 32"><path d="M22 5c-9 2-12 14-4 20 3 2 7 2 10 1-4 4-11 5-16 1C3 21 5 8 14 4c3-1 6-1 8 1Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
}
function cardPower(v,u,si){const c=v.cards[u.cardId];let p=c.p||0;(u.items||[]).forEach(it=>p+=v.cards[it.cardId].pb||0);if(si===0&&c.c<=2)p++;if(si===2&&v.form[u.owner])p++;return p}
function scenePower(v,p,si){return v.scenes[si].units.filter(u=>u.owner===p).reduce((a,u)=>a+cardPower(v,u,si),0)}
function canClaim(v,si){return v.yourTurn&&!v.claimed[v.you]&&scenePower(v,v.you,si)>scenePower(v,v.opponent,si)&&v.scenes[si].units.some(u=>u.owner===v.you&&u.ready)}
function locOf(v,uid){for(let si=0;si<3;si++){const u=v.scenes[si].units.find(x=>x.uid===uid);if(u)return {si,u}}return null}
function shellTop(){
 return '<div class="shell-top"><div class="brand"><div class="brand-mark"></div><strong>HANA TCG</strong><span class="version">v0.4</span></div><button class="btn small ghost" data-ui="rules">Rules</button></div>';
}
function rules(){
 return '<div class="rules"><b>WIN</b> · Claim 5 Memories.<br><b>TURN</b> · Take one action, then your opponent responds.<br><b>SCENE</b> · Have more Power there, then exhaust a ready character to Claim.<br><b>ENERGY</b> · Starts at 2 and grows each round to 8.<br><b>OVERDRIVE</b> · Once per game, +2 Energy now; your max does not grow next round.</div>';
}
function lobby(msg){
 return shellTop()+(rulesOpen?rules():"")+
 '<section class="hero"><div class="eyebrow">FIRST ENCOUNTER</div><h1>Control a Scene.<br>Claim a Memory.</h1><p>Three places. One action at a time. First to five Memories wins.</p></section>'+
 '<div class="mode"><button class="mode-main" data-ui="tutorial"><div class="eyebrow">Recommended · learn while playing</div><strong>Learn with Hana →</strong><span>Hana vs Le · Rookie AI · about 8–12 minutes</span></button>'+
 '<div><div class="eyebrow" style="margin:3px 0 7px">VS COMPUTER</div><div class="mode-row"><button class="btn" data-ui="bot" data-diff="rookie">Rookie</button><button class="btn primary" data-ui="bot" data-diff="rival">Rival</button><button class="btn" data-ui="bot" data-diff="weaver">Weaver</button></div></div></div>'+
 '<div class="rule-strip"><div><b>3</b>Scenes</div><div><b>1</b>Action at a time</div><div><b>5</b>Memories to win</div></div>'+
 '<button class="btn ghost" style="width:100%" data-ui="share">Play a friend · share room link</button>'+
 (errorText?'<div class="notice">'+esc(errorText)+'</div>':'');
}
const identity={
 hana:{tags:"FAST · DIRECT · RISKY",copy:"Move first, create pressure, and turn Overdrive into tempo."},
 le:{tags:"TACTICAL · FLUID · PATIENT",copy:"Move the fight, protect position, and win the Scene that matters."},
 rei:{tags:"BUILD · SCALE · ENDURE",copy:"Equip characters and turn small advantages into a durable board."},
 firefly:{tags:"TRICKS · DISRUPT · ESCAPE",copy:"Exhaust threats, move pieces, and punish predictable plans."}
};
function chooseDeck(v,msg){
 const order=["hana","le","rei","firefly"];
 return shellTop()+(rulesOpen?rules():"")+
 '<section class="hero" style="padding-top:16px"><div class="eyebrow">'+(msg.mode==="bot"?"VS "+esc((msg.botDifficulty||"rival").toUpperCase()):"FRIEND MATCH")+'</div><h1>Choose how you want to play.</h1><p>Your opponent choice stays hidden until both decks are locked.</p></section>'+
 '<div class="deck-list">'+order.map(k=>{const d=v.deckInfo[k],id=identity[k];return '<button class="deck-choice '+d.element+'" data-deck="'+k+'"><div class="eyebrow">'+esc(d.element.toUpperCase())+'</div><h3>'+esc(d.name)+'</h3><div class="deck-tags">'+id.tags+'</div><div class="deck-copy">'+id.copy+'</div><div class="deck-awaken"><b>AWAKEN</b> · '+esc(d.trigger)+'</div></button>'}).join("")+'</div>'+
 (v.opponentLocked?'<div class="notice"><b>Opponent locked.</b> Their hero is still hidden.</div>':'')+
 (errorText?'<div class="notice">'+esc(errorText)+'</div>':'');
}
function hud(v,msg){
 const yd=deck(v,v.you),od=deck(v,v.opponent),your= v.yourTurn?"YOUR MOVE":(v.opponent==="BOT"?"COMPUTER MOVE":"OPPONENT MOVE");
 const yname=yd?yd.lead:"You", oname=v.opponent==="BOT"?(od?"Computer · "+od.lead:"Computer"):(od?od.lead:"Opponent");
 return '<section class="hud"><div class="turnline"><div class="turnstate">'+your+'</div><div class="round">Round '+v.round+(msg.botDifficulty?' · '+esc(msg.botDifficulty.toUpperCase()):'')+'</div></div>'+
 '<div class="players"><div class="playerbox"><div class="playername">YOU · '+esc(yname)+'</div><div class="player-meta">'+dots(v.memories[v.you])+'<span>'+v.energy[v.you]+'/'+v.maxEnergy[v.you]+' Energy</span></div></div><div class="versus">VS</div>'+
 '<div class="playerbox right"><div class="playername">'+esc(oname)+'</div><div class="player-meta">'+dots(v.memories[v.opponent])+'<span>'+v.handCount[v.opponent]+' cards</span></div></div></div></section>';
}
function sceneTabs(v){
 return '<nav class="scene-tabs">'+v.scenes.map((s,i)=>{const yp=scenePower(v,v.you,i),op=scenePower(v,v.opponent,i);return '<button class="scene-tab '+(i===activeScene?'active ':'')+(canClaim(v,i)?'claimable':'')+'" data-scene="'+i+'"><strong>'+esc(s.name)+'</strong><span>'+yp+'–'+op+(canClaim(v,i)?' · CLAIM':'')+'</span></button>'}).join("")+'</nav>';
}
function unitHTML(v,u,si,own){
 const c=v.cards[u.cardId],target=isValidTarget(v,u,si);
 return '<button class="unit '+c.e+' '+(u.ready?'':'exhausted ')+(selectedUnit===u.uid?'selected ':'')+(target?'target':'')+'" data-unit="'+esc(u.uid)+'" '+((!v.yourTurn&&!target)||(!own&&!target&&mode!=="challenge")?'disabled':'')+'>'+
 '<div class="unit-name">'+esc(c.n)+'</div><div class="unit-stats"><span class="p">P '+cardPower(v,u,si)+'</span> · <span class="h">HP '+u.hp+'/'+u.maxHp+'</span></div><div class="unit-state">'+(u.ready?'READY':'USED')+'</div></button>';
}
function isValidTarget(v,u,si){
 if(!selectedCard)return mode==="challenge"&&u.owner===v.opponent&&si===activeScene;
 const c=v.cards[selectedCard.cardId];
 if(c.t==="item"||c.target==="own")return u.owner===v.you;
 if(c.target==="enemy")return u.owner===v.opponent;
 if(c.target==="ownMove")return u.owner===v.you;
 if(c.target==="enemyMove")return u.owner===v.opponent;
 return false;
}
function scene(v){
 const s=v.scenes[activeScene],yp=scenePower(v,v.you,activeScene),op=scenePower(v,v.opponent,activeScene);
 const diff=yp-op,status=diff>0?"You lead by "+diff:diff<0?"Behind by "+Math.abs(diff):"Tied";
 const own=s.units.filter(u=>u.owner===v.you),foe=s.units.filter(u=>u.owner===v.opponent);
 const tone=activeScene===0?"flame":activeScene===1?"tide":"veil";
 return '<section class="scene-card"><div class="scene-head '+tone+'"><div class="scene-title"><div><h2>'+esc(s.name)+'</h2><div class="scene-rule">'+esc(s.text)+'</div></div><div class="lead-state '+(diff>0?'you':'')+'">'+status+'</div></div></div>'+
 '<div class="zone"><div class="zone-label"><span>Opponent</span><span>'+op+' Power</span></div><div class="unit-row">'+(foe.length?foe.map(u=>unitHTML(v,u,activeScene,false)).join(""):'<div class="empty">OPEN</div>')+'</div></div>'+
 '<div class="power-meter"><div><b>'+op+'</b><br><span>THEM</span></div><div class="power-message '+(diff>0?'you':'')+'">'+status+'</div><div><b>'+yp+'</b><br><span>YOU</span></div></div>'+
 '<div class="zone"><div class="zone-label"><span>You</span><span>'+yp+' Power</span></div><div class="unit-row">'+(own.length?own.map(u=>unitHTML(v,u,activeScene,true)).join(""):'<div class="empty">PLAY HERE</div>')+'</div></div></section>';
}
function cardHTML(v,x){
 const c=v.cards[x.cardId],price=v.playCosts[x.uid]??c.c,afford=price<=v.energy[v.you];
 return '<button class="card '+c.e+' '+(afford?'':'disabled ')+(selectedCard?.uid===x.uid?'selected':'')+'" data-card="'+esc(x.uid)+'" '+(!v.yourTurn?'disabled':'')+'>'+
 '<div class="card-art">'+elementGlyph(c.e)+(afford?'<span class="playtag">PLAY</span>':'')+'</div><div class="card-cost">'+price+'</div><div class="card-body"><div class="card-name">'+esc(c.n)+'</div><div class="card-type">'+esc(c.e)+' · '+esc(c.t)+'</div><div class="card-text">'+esc(c.x)+'</div></div>'+
 '<div class="card-foot">'+(c.t==="character"?'<span>P '+c.p+'</span><span>HP '+c.h+'</span>':'<span>'+c.t.toUpperCase()+'</span><span>'+price+' E</span>')+'</div></button>';
}
function context(v){
 if(!v.yourTurn)return '<section class="context"><div class="context-title">Opponent is acting</div><div class="context-copy">Watch how the board changes. Your turn comes after one action.</div></section>';
 if(selectedCard){
  const c=v.cards[selectedCard.cardId],price=v.playCosts[selectedCard.uid]??c.c;
  if(price>v.energy[v.you])return '<section class="context"><div class="context-title">'+esc(c.n)+'</div><div class="context-copy">Costs '+price+' Energy. You have '+v.energy[v.you]+'. Choose another card or use Overdrive.</div><div class="context-actions"><button class="btn ghost full" data-ui="clear">Cancel</button></div></section>';
  if(c.t==="character")return '<section class="context"><div class="context-title">PLAY '+esc(c.n)+'</div><div class="context-copy">Put this character into <b>'+esc(v.scenes[activeScene].name)+'</b>.</div><div class="context-actions"><button class="btn primary full" data-play-card="'+esc(selectedCard.uid)+'" data-play-scene="'+activeScene+'">Play here · '+price+' Energy</button><button class="btn ghost full" data-ui="clear">Cancel</button></div></section>';
  if(c.t==="moment"&&c.target==="none")return '<section class="context"><div class="context-title">PLAY '+esc(c.n)+'</div><div class="context-copy">'+esc(c.x)+'</div><div class="context-actions"><button class="btn primary full" data-play-card="'+esc(selectedCard.uid)+'">Play now · '+price+' Energy</button><button class="btn ghost full" data-ui="clear">Cancel</button></div></section>';
  if(pendingTarget&&(c.target==="ownMove"||c.target==="enemyMove")){
    const z=locOf(v,pendingTarget);return '<section class="context"><div class="context-title">'+esc(c.n)+'</div><div class="context-copy">Choose where to move <b>'+esc(v.cards[z.u.cardId].n)+'</b>.</div><div class="context-actions">'+v.scenes.map((s,i)=>i===z.si?'':'<button class="btn" data-move-effect="'+i+'">'+esc(s.name)+'</button>').join("")+'<button class="btn ghost full" data-ui="clear">Cancel</button></div></section>';
  }
  let who=(c.t==="item"||c.target==="own")?"one of your characters":(c.target==="enemy"?"an enemy character":"a character");
  return '<section class="context"><div class="context-title">'+esc(c.n)+'</div><div class="context-copy">'+esc(c.x)+'<br><b>Tap '+who+' to target it.</b> You can switch Scenes while this card stays selected.</div><div class="context-actions"><button class="btn ghost full" data-ui="clear">Cancel</button></div></section>';
 }
 if(selectedUnit){
  const z=locOf(v,selectedUnit);if(!z)return "";
  const c=v.cards[z.u.cardId],actions=[];
  if(z.si===activeScene&&z.u.ready&&canClaim(v,activeScene))actions.push('<button class="btn gold full" data-unit-action="claim">Claim Memory</button>');
  const enemies=v.scenes[z.si].units.filter(u=>u.owner===v.opponent);
  if(z.u.ready&&enemies.length)actions.push('<button class="btn" data-ui="challenge">Challenge…</button>');
  if(z.u.ready)v.scenes.forEach((s,i)=>{if(i!==z.si)actions.push('<button class="btn" data-move-unit="'+i+'">Move → '+esc(s.name)+'</button>')});
  actions.push('<button class="btn ghost" data-ui="clear">Cancel</button>');
  return '<section class="context"><div class="context-title">'+esc(c.n)+' · '+(z.u.ready?'READY':'USED')+'</div><div class="context-copy">'+(z.u.ready?'Choose one action for this character.':'This character is exhausted until the next round.')+'</div><div class="context-actions">'+actions.join("")+'</div></section>';
 }
 if(mode==="challenge"&&selectedUnit){
   return "";
 }
 if(canClaim(v,activeScene))return '<section class="context"><div class="context-title">YOU CONTROL THIS SCENE</div><div class="context-copy">Tap one of your ready characters below, then Claim a Memory.</div></section>';
 return '<section class="context"><div class="context-title">YOUR DECISION</div><div class="context-copy">Tap a card in your hand to play it, or tap one of your ready characters to move, fight, or claim.</div></section>';
}
function coach(v,msg){
 if(!msg.tutorial)return "";
 const m=v.metrics?.[v.you]||{};
 if((m.plays||0)===0)return '<div class="coach"><div><b>1 · PUT SOMEONE ON THE BOARD</b>Tap a card marked PLAY. Pick the Scene you want first, then play the card there.</div></div>';
 if(v.memories[v.you]===0&&v.scenes.some((_,i)=>canClaim(v,i)))return '<div class="coach"><div><b>2 · YOU ARE AHEAD</b>Tap a ready character in the Scene you control, then Claim Memory.</div></div>';
 if(v.memories[v.you]===0)return '<div class="coach"><div><b>2 · CREATE A LEAD</b>More Power at a Scene lets you claim. Add Power, move, or challenge.</div></div>';
 if(!v.overdriveUsed[v.you]&&v.round>=2)return '<div class="coach"><div><b>3 · OVERDRIVE IS OPTIONAL</b>+2 Energy now can create a swing, but your max will not grow next round.</div></div>';
 return "";
}
function hand(v){
 return '<section class="hand-section"><div class="hand-head"><strong>YOUR HAND · '+v.handCount[v.you]+' CARDS</strong><span class="energy">'+v.energy[v.you]+' Energy</span></div><div class="hand-row">'+v.hands.map(x=>cardHTML(v,x)).join("")+'</div></section>';
}
function tools(v){
 return '<div class="turn-tools"><button class="btn" data-action="overdrive" '+(!v.yourTurn||v.overdriveUsed[v.you]?'disabled':'')+'>Overdrive +2</button><button class="btn" data-action="pass" '+(!v.yourTurn?'disabled':'')+'>Pass</button></div>';
}
function feedback(v,msg){
 if(feedbackSent)return '<div class="notice"><b>Feedback saved.</b> Thank you — this is exactly what v0.4 needs.';
 return '<div class="feedback"><div class="eyebrow">30-second playtest</div><div class="feedback-grid"><select id="fun"><option value="">Fun 1–5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="clear"><option value="">Clarity 1–5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="again"><option value="">Play again?</option><option value="yes">Yes</option><option value="no">No</option></select><button class="btn primary" data-ui="feedback">Send feedback</button></div></div>';
}
function result(v,msg){
 if(msg.status!=="over")return "";
 const m=v.metrics?.[v.you]||{},win=msg.result?.winner===v.you,score=v.memories[v.you]+"–"+v.memories[v.opponent];
 const tip=(m.claims||0)<3?"Next match: prioritize Memories over simply building the biggest board.":(m.challenges||0)===0?"Next match: try removing one key blocker with a Challenge.":(m.overdrives||0)===0?"Next match: look for one decisive Overdrive turn.":"You used the full core loop. Try a different hero next.";
 return '<section class="result"><div class="eyebrow">MATCH '+msg.matchNumber+'</div><h2>'+(win?'Victory':'Match complete')+' · '+score+'</h2><div style="color:var(--muted);font-size:11px">'+v.round+' rounds · '+v.actionCount+' actions'+(msg.firstActionMs?' · first move '+Math.max(1,Math.round(msg.firstActionMs/1000))+'s':'')+'</div><div class="result-grid"><div class="result-stat"><b>'+(m.plays||0)+'</b><span>Cards</span></div><div class="result-stat"><b>'+(m.claims||0)+'</b><span>Claims</span></div><div class="result-stat"><b>'+(m.challenges||0)+'</b><span>Fights</span></div><div class="result-stat"><b>'+(m.transforms||0)+'</b><span>Awaken</span></div></div><div class="notice">'+tip+'</div>'+feedback(v,msg)+'<button class="btn primary" style="width:100%;margin-top:10px" data-ui="reset">Play again</button></section>';
}
function game(v,msg){
 const s=v.scenes[activeScene],log=v.log?.[0]||"";
 return shellTop()+(rulesOpen?rules():"")+hud(v,msg)+coach(v,msg)+sceneTabs(v)+scene(v)+context(v)+hand(v)+tools(v)+(log?'<div class="last-action">Last action · '+esc(log)+'</div>':'')+result(v,msg)+(errorText?'<div class="notice">'+esc(errorText)+'</div>':'');
}
function render(msg){
 last=msg;const v=msg.view;
 if(!v){root.innerHTML=lobby(msg);return}
 if(v.phase==="choose"){root.innerHTML=chooseDeck(v,msg);return}
 root.innerHTML=game(v,msg);
}
function clearSelection(){selectedCard=null;selectedUnit=null;pendingTarget=null;mode=null}
async function act(action){
 if(busy)return;try{busy=true;errorText="";const msg=await api({op:"action",action});clearSelection();render(msg)}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}
}
async function startBot(diff){if(busy)return;try{busy=true;errorText="";render(await api({op:"bot",difficulty:diff}))}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}}
async function startTutorial(){if(busy)return;try{busy=true;errorText="";clearSelection();render(await api({op:"tutorial"}))}catch(e){errorText=e.message;if(last)render(last)}finally{busy=false}}
async function shareRoom(){const u=location.href;try{if(navigator.share)await navigator.share({title:"HANA TCG",text:"Play a match with me.",url:u});else if(navigator.clipboard){await navigator.clipboard.writeText(u);errorText="Room link copied.";render(last)}else prompt("Send this room link:",u)}catch{}}
root.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.ui==="rules"){rulesOpen=!rulesOpen;render(last);return}
 if(b.dataset.ui==="share"){await shareRoom();return}
 if(b.dataset.ui==="tutorial"){await startTutorial();return}
 if(b.dataset.ui==="bot"){await startBot(b.dataset.diff||"rival");return}
 if(b.dataset.ui==="clear"){clearSelection();render(last);return}
 if(b.dataset.deck){await act({type:"selectDeck",deck:b.dataset.deck});return}
 if(b.dataset.scene!==undefined){activeScene=Math.max(0,Math.min(2,Number(b.dataset.scene)||0));render(last);return}
 if(b.dataset.card){
   const v=last.view,x=v.hands.find(x=>x.uid===b.dataset.card);selectedUnit=null;pendingTarget=null;mode=null;selectedCard=selectedCard?.uid===x.uid?null:x;render(last);return;
 }
 if(b.dataset.playCard){
   const a={type:"play",uid:b.dataset.playCard};if(b.dataset.playScene!==undefined)a.scene=Number(b.dataset.playScene);await act(a);return;
 }
 if(b.dataset.unit){
   const v=last.view,z=locOf(v,b.dataset.unit);if(!z)return;
   if(selectedCard){
     const c=v.cards[selectedCard.cardId];
     const own=z.u.owner===v.you;
     if(c.t==="item"&&own){await act({type:"play",uid:selectedCard.uid,target:z.u.uid});return}
     if(c.target==="own"&&own){await act({type:"play",uid:selectedCard.uid,target:z.u.uid});return}
     if(c.target==="enemy"&&!own){await act({type:"play",uid:selectedCard.uid,target:z.u.uid});return}
     if((c.target==="ownMove"&&own)||(c.target==="enemyMove"&&!own)){pendingTarget=z.u.uid;render(last);return}
     return;
   }
   if(mode==="challenge"&&selectedUnit&&z.u.owner===v.opponent){await act({type:"challenge",attacker:selectedUnit,target:z.u.uid});return}
   if(z.u.owner===v.you){selectedUnit=selectedUnit===z.u.uid?null:z.u.uid;mode=null;render(last)}return;
 }
 if(b.dataset.moveEffect!==undefined&&selectedCard&&pendingTarget){await act({type:"play",uid:selectedCard.uid,target:pendingTarget,scene:Number(b.dataset.moveEffect)});return}
 if(b.dataset.moveUnit!==undefined&&selectedUnit){await act({type:"move",uid:selectedUnit,scene:Number(b.dataset.moveUnit)});return}
 if(b.dataset.unitAction==="claim"&&selectedUnit){await act({type:"claim",uid:selectedUnit});return}
 if(b.dataset.ui==="challenge"){mode="challenge";render(last);return}
 if(b.dataset.action){await act({type:b.dataset.action});return}
 if(b.dataset.ui==="reset"){try{feedbackSent=false;clearSelection();render(await api({op:"reset"}))}catch(e){errorText=e.message;render(last)}return}
 if(b.dataset.ui==="feedback"){
   const fun=Number(document.querySelector("#fun")?.value),clarity=Number(document.querySelector("#clear")?.value),again=document.querySelector("#again")?.value;
   if(!fun||!clarity||!again){errorText="Please answer all three playtest questions.";render(last);return}
   try{await api({op:"feedback",funScore:fun,clarityScore:clarity,rematch:again==="yes"});feedbackSent=true;errorText="";render(last)}catch(e){errorText=e.message;render(last)}return;
 }
});
async function boot(){try{render(await api({op:"join"}))}catch(e){root.innerHTML=shellTop()+'<div class="notice">Could not join: '+esc(e.message)+'</div>'}}
setInterval(async()=>{if(busy)return;try{const msg=await api({op:"state"});if(!last||msg.version!==last.version||msg.status!==last.status)render(msg)}catch{}},900);
boot();
</script>
</body>
</html>
